<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex,nofollow" />
<title>Verificação</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:Roboto,Arial,Helvetica,sans-serif;
    background:#f9f9f9;
    color:#202124;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    width:100%;
    max-width:320px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .rc-anchor{
    width:100%;
    max-width:304px;
    height:78px;
    background:#f9f9f9;
    border:1px solid #d3d3d3;
    border-radius:3px;
    box-shadow:0 0 4px 1px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    padding:0 12px 0 14px;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .rc-checkbox{
    width:28px;
    height:28px;
    border:2px solid #c1c1c1;
    border-radius:2px;
    background:#fff;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease, background .15s ease;
    position:relative;
  }
  .rc-checkbox:hover{border-color:#a0a0a0}
  .rc-checkbox.is-checked{
    border-color:#1a73e8;
    background:#1a73e8;
  }
  .rc-checkbox svg{
    width:18px;
    height:18px;
    opacity:0;
    transform:scale(.6);
    transition:opacity .15s ease, transform .15s ease;
  }
  .rc-checkbox.is-checked svg{
    opacity:1;
    transform:scale(1);
  }
  .rc-checkbox.is-loading{
    border-color:#c1c1c1;
    background:#fff;
    pointer-events:none;
  }
  .rc-checkbox.is-loading svg{display:none}
  .rc-spinner{
    display:none;
    width:20px;
    height:20px;
    border:2px solid #e0e0e0;
    border-top-color:#1a73e8;
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  .rc-checkbox.is-loading .rc-spinner{display:block}

  @keyframes spin{to{transform:rotate(360deg)}}

  .rc-label{
    flex:1;
    margin-left:12px;
    font-size:14px;
    color:#000;
    cursor:pointer;
    line-height:1.3;
  }

  .rc-brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-left:8px;
    flex-shrink:0;
    width:58px;
  }
  .rc-logo{
    width:32px;
    height:32px;
    margin-bottom:2px;
  }
  .rc-brand-name{
    font-size:10px;
    color:#555;
    letter-spacing:.2px;
    line-height:1;
  }
  .rc-links{
    margin-top:3px;
    font-size:8px;
    color:#555;
    line-height:1;
  }
  .rc-links span{opacity:.85}

  .btn-continuar{
    display:none;
    width:100%;
    max-width:304px;
    appearance:none;
    border:none;
    background:#0a0a0a;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;
    padding:14px 20px;
    border-radius:10px;
    cursor:pointer;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease, background .15s ease;
  }
  .btn-continuar.is-visible{
    display:block;
    opacity:1;
    transform:translateY(0);
  }
  .btn-continuar:hover{background:#222}
  .btn-continuar:active{transform:scale(.98)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="rc-anchor" id="rcAnchor" role="group" aria-label="Verificação">
      <button type="button" class="rc-checkbox" id="rcCheck" aria-checked="false" aria-label="Não sou um robô">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12.5l5 5L19 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="rc-spinner" aria-hidden="true"></span>
      </button>
      <span class="rc-label" id="rcLabel" role="button" tabindex="0">Não sou um robô</span>
      <div class="rc-brand" aria-hidden="true">
        <svg class="rc-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" fill="none"/>
          <path d="M32 8c13.255 0 24 10.745 24 24h-8a16 16 0 0 0-16-16V8z" fill="#1a73e8"/>
          <path d="M32 56C18.745 56 8 45.255 8 32h8a16 16 0 0 0 16 16v8z" fill="#9aa0a6"/>
          <path d="M48 20l8-4v10l-8-2z" fill="#1a73e8"/>
          <path d="M16 44l-8 4V38l8 2z" fill="#9aa0a6"/>
          <circle cx="32" cy="32" r="7" fill="#fff" stroke="#dadce0" stroke-width="1"/>
          <circle cx="32" cy="32" r="3.5" fill="#5f6368"/>
        </svg>
        <div class="rc-brand-name">reCAPTCHA</div>
        <div class="rc-links"><span>Privacidade</span> - <span>Termos</span></div>
      </div>
    </div>

    <button type="button" class="btn-continuar" id="btnContinuar">Continuar</button>
  </div>

<script>
(function () {
  var KEY = "antibot_passed";

  function qs() { return window.location.search || ""; }

  function goHome() {
    // Vai pro funil real (SPA) preservando UTMs/clickIds.
    window.location.replace("/" + qs());
  }

  if (sessionStorage.getItem(KEY) === "1") { goHome(); return; }

  var check = document.getElementById("rcCheck");
  var btn = document.getElementById("btnContinuar");
  var label = document.getElementById("rcLabel");
  var done = false;

  function passCheck() {
    if (done) return;
    done = true;
    check.classList.add("is-loading");
    check.setAttribute("aria-checked", "true");
    setTimeout(function () {
      check.classList.remove("is-loading");
      check.classList.add("is-checked");
      btn.classList.add("is-visible");
      btn.focus();
    }, 650);
  }

  check.addEventListener("click", passCheck);
  label.addEventListener("click", passCheck);
  label.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); passCheck(); }
  });

  btn.addEventListener("click", function () {
    try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
    goHome();
  });
})();
</script>
</body>
</html>
