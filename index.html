    <style>
      /* PIX modal — inline, sem dependência do CSS do bundle */
      #pix-modal-root { position: fixed; inset: 0; z-index: 99999; display: none; }
      #pix-modal-root.open { display: block; }
      #pix-modal-root .pm-backdrop {
        position: absolute; inset: 0;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(4px);
        animation: pm-fade 0.2s ease-out;
      }
      #pix-modal-root .pm-sheet {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: min(440px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        background: #fff;
        border-radius: 24px;
        padding: 24px 20px;
        box-shadow: 0 24px 48px -12px rgba(0,0,0,0.4);
        animation: pm-slide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #0f172a;
      }
      @keyframes pm-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pm-slide {
        from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); }
        to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      }
      #pix-modal-root .pm-close {
        position: absolute; top: 14px; right: 14px;
        width: 32px; height: 32px; border: none;
        background: #f1f5f9; color: #475569;
        border-radius: 999px; cursor: pointer;
        font-size: 18px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      #pix-modal-root .pm-close:hover { background: #e2e8f0; }
      #pix-modal-root .pm-badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: #ecfdf5; color: #059669;
        padding: 4px 10px; border-radius: 999px;
        font-size: 11px; font-weight: 700;
        margin-bottom: 10px;
      }
      #pix-modal-root .pm-badge::before {
        content: ''; width: 6px; height: 6px; background: #10b981;
        border-radius: 50%;
        animation: pm-pulse 1.4s ease-in-out infinite;
      }
      @keyframes pm-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      #pix-modal-root .pm-title { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
      #pix-modal-root .pm-desc { color: #64748b; font-size: 13px; margin: 0 0 12px; }
      #pix-modal-root .pm-price {
        text-align: center; font-size: 32px; font-weight: 800;
        letter-spacing: -0.02em; margin: 8px 0 16px;
      }
      #pix-modal-root .pm-price .cents { font-size: 20px; color: #475569; margin-left: 2px; }
      #pix-modal-root .pm-qr {
        background: #fff; border: 2px dashed #cbd5e1; border-radius: 16px;
        padding: 14px; display: flex; justify-content: center; margin: 8px 0 16px;
      }
      #pix-modal-root .pm-qr img { width: 210px; height: 210px; display: block; }
      #pix-modal-root .pm-label { font-size: 12px; font-weight: 700; color: #334155; margin: 12px 0 6px; }
      #pix-modal-root .pm-code {
        background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 12px; font-family: 'SF Mono', Consolas, monospace;
        font-size: 11px; color: #334155; word-break: break-all;
        max-height: 84px; overflow-y: auto;
      }
      #pix-modal-root .pm-btn {
        width: 100%; padding: 14px 18px; border: none;
        border-radius: 14px; font-size: 15px; font-weight: 800;
        font-family: inherit; cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
        margin-top: 10px;
      }
      #pix-modal-root .pm-btn:active { transform: scale(0.98); }
      #pix-modal-root .pm-btn:disabled { opacity: 0.75; cursor: not-allowed; }
      #pix-modal-root .pm-btn:disabled:active { transform: none; }
      #pix-modal-root .spinner {
        display: inline-block; width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
        border-radius: 50%; animation: pm-spin 0.7s linear infinite;
        vertical-align: -2px;
      }
      #pix-modal-root .pm-btn-copy { background: #f1f5f9; color: #334155; }
      #pix-modal-root .pm-btn-paid {
        background: linear-gradient(180deg, #16C764 0%, #0ea855 100%);
        color: #fff; box-shadow: 0 6px 18px -6px rgba(22,199,100,0.5);
        min-height: 56px;
      }
      #pix-modal-root .pm-steps { margin: 18px 0 6px; }
      #pix-modal-root .pm-step {
        display: flex; gap: 10px; align-items: flex-start;
        margin: 8px 0; font-size: 13px; color: #475569;
      }
      #pix-modal-root .pm-step-n {
        flex: none; background: #16C764; color: #fff;
        width: 22px; height: 22px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 700;
      }
      #pix-modal-root .pm-loading {
        padding: 40px 0; text-align: center; color: #64748b; font-size: 14px;
      }
      #pix-modal-root .pm-spinner {
        display: inline-block; width: 32px; height: 32px;
        border: 3px solid #e2e8f0; border-top-color: #16C764;
        border-radius: 50%; animation: pm-spin 0.7s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes pm-spin { to { transform: rotate(360deg); } }
      #pix-modal-root .pm-error {
        background: #fef2f2; color: #b91c1c;
        border: 1px solid #fecaca; border-radius: 10px;
        padding: 12px; font-size: 13px; margin-top: 10px;
      }

  <body>
    <div id="root"></div>

    <!-- PIX modal (montado uma vez, controlado via window.__pixModal) -->
    <div id="pix-modal-root" aria-hidden="true">
      <div class="pm-backdrop" data-pm-close></div>
      <div class="pm-sheet" role="dialog" aria-modal="true">
        <button class="pm-close" type="button" data-pm-close aria-label="Fechar">×</button>
        <div id="pm-body"></div>
      </div>
    </div>

    <script>
    (function () {
      // Extrai slug de URL tipo "/checkout.html?p=SLUG&name=...&..."
      function extractSlug(url) {
        try {
          const u = new URL(url, window.location.origin);
          return u.searchParams.get('p') || '';
        } catch { return ''; }
      }

      function getCustomer() {
        try {
          const raw = localStorage.getItem('emprestimo');
          const d = raw ? JSON.parse(raw) : {};
          const onlyDigits = (v) => String(v || '').replace(/\D/g, '');
          return {
            name:  (d.nome || '').trim(),
            email: (d.email || '').trim().toLowerCase(),
            cpf:   onlyDigits(d.cpf),
            phone: onlyDigits(d.phone),
          };
        } catch {
          return { name: '', email: '', cpf: '', phone: '' };
        }
      }

      const root = document.getElementById('pix-modal-root');
      const body = document.getElementById('pm-body');
      let currentSlug = null;
      let currentCustomer = null;
      let currentPixData = null;
      let isLoading = false;
      let activePoll = null;
      const POLL_INTERVAL_MS = 3000;
      const POLL_TIMEOUT_MS = 8 * 60 * 1000; // 8min (PIX expira ~5-10min)

      function stopPolling() {
        if (activePoll) { activePoll.stop(); activePoll = null; }
      }

      function open() {
        root.classList.add('open');
        root.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }
      function close(reload) {
        stopPolling();
        root.classList.remove('open');
        root.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        body.innerHTML = '';
        // Reset do botão "Abrindo pagamento..." travado no _a — reload é o jeito
        // mais simples sem mexer no componente React.
        if (reload) setTimeout(() => window.location.reload(), 80);
      }

      // Fechar via backdrop ou X: reset via reload
      root.addEventListener('click', (ev) => {
        if (ev.target.matches('[data-pm-close]')) close(true);
      });
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape' && root.classList.contains('open')) close(true);
      });

      function renderLoading() {
        body.innerHTML =
          '<div class="pm-loading"><div class="pm-spinner"></div><div>Gerando seu PIX…</div></div>';
      }
      function renderError(msg, fallbackUrl) {
        body.innerHTML =
          '<div class="pm-error">' + escapeHtml(msg) + '</div>' +
          '<button type="button" class="pm-btn pm-btn-paid" id="pm-fallback">Abrir página de pagamento</button>';
        document.getElementById('pm-fallback').onclick = () => {
          window.location.href = fallbackUrl;
        };
      }
      function renderPix(data) {
        currentPixData = data;
        const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=0&data=' +
          encodeURIComponent(data.qrcode);
        // gateEnabled vem sempre true do server hoje (sem KV no projeto — ver
        // freepay-webhook.js). Se algum dia a criação de PIX puder responder
        // sem gate, o botão fica liberado direto em vez de esperar o polling.
        const gated = data.gateEnabled === true;
        const btnInitialText = gated ? 'Aguardando pagamento…' : 'Já paguei — Continuar';
        const btnInitialDisabled = gated ? 'disabled' : '';

        body.innerHTML =
          '<span class="pm-badge" id="pm-badge">Pagamento gerado</span>' +
          '<h2 class="pm-title">' + escapeHtml(data.description || 'Pagamento') + '</h2>' +
          '<p class="pm-desc" id="pm-desc">Escaneie o QR ou copie o código PIX</p>' +
          '<div class="pm-price">' + PixShared.fmtPrice(data.amount) + '</div>' +
          '<div class="pm-qr"><img id="pm-qr" alt="QR PIX" src="' + qrSrc + '"></div>' +
          '<div class="pm-label">PIX Copia e Cola</div>' +
          '<div class="pm-code" id="pm-code"></div>' +
          '<button type="button" class="pm-btn pm-btn-copy" id="pm-copy">Copiar código PIX</button>' +
          '<div class="pm-steps">' +
            '<div class="pm-step"><span class="pm-step-n">1</span><span>Abra o app do seu banco</span></div>' +
            '<div class="pm-step"><span class="pm-step-n">2</span><span>Escolha PIX (QR ou Copia e Cola)</span></div>' +
            '<div class="pm-step"><span class="pm-step-n">3</span><span>Confirme o pagamento</span></div>' +
            '<div class="pm-step"><span class="pm-step-n">4</span><span>' + (gated ? 'Aguarde a confirmação automática' : 'Volte e clique em "Já paguei"') + '</span></div>' +
          '</div>' +
          '<button type="button" class="pm-btn pm-btn-paid" id="pm-paid" ' + btnInitialDisabled + '>' +
            (gated ? '<span class="spinner" style="margin-right:8px;"></span>' : '') + btnInitialText +
          '</button>';

        PixShared.trackEvent('InitiateCheckout', { data, customer: currentCustomer });

        // Inicia polling se gate ativo. Se desabilitado, usuário confia como antes.
        if (gated && data.transactionId) startPolling(data);

        document.getElementById('pm-code').textContent = data.qrcode;

        document.getElementById('pm-qr').onerror = function () {
          this.onerror = null;
          this.src = 'https://chart.googleapis.com/chart?cht=qr&chs=440x440&chl=' + encodeURIComponent(data.qrcode);
        };

        document.getElementById('pm-copy').onclick = async () => {
          const btn = document.getElementById('pm-copy');
          try {
            await navigator.clipboard.writeText(data.qrcode);
            const old = btn.textContent;
            btn.textContent = 'Copiado!';
            setTimeout(() => { btn.textContent = old; }, 1500);
          } catch {
            const range = document.createRange();
            range.selectNodeContents(document.getElementById('pm-code'));
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(range);
          }
        };

        document.getElementById('pm-paid').onclick = () => {
          const btn = document.getElementById('pm-paid');
          // Se gate ativo, botão só habilita quando polling confirma.
          if (btn.disabled) return;
          if (btn.dataset.clicked) return; // evita disparo duplo (clique manual + auto-avanço)
          btn.dataset.clicked = '1';
          // Vai pro /retorno — mantém a UX do fluxo antigo (animação
          // "Processando… ✓ Confirmado" → auto-navega pro upsell).
          // /retorno lê localStorage.checkout_next_url que o d5 já setou.
          window.location.href = window.location.origin + '/retorno';
        };
      }

      // Poll /api/pix-status a cada 3s. Ao detectar paid, habilita botão e
      // troca copy pra "Pagamento confirmado". Timeout 8min → mostra expirado.
      // Sem fallback por tempo: botão só libera com confirmação real (paid).
      function startPolling(data) {
        stopPolling();
        activePoll = PixShared.poll({
          transactionId: data.transactionId,
          expiresAt: data.expiresAt,
          intervalMs: POLL_INTERVAL_MS,
          timeoutMs: POLL_TIMEOUT_MS,
          onPaid: () => markConfirmed(),
          onRejected: (status) => markRejected(status),
          onExpired: () => markExpired(),
        });
      }

      function markConfirmed() {
        const btn = document.getElementById('pm-paid');
        const badge = document.getElementById('pm-badge');
        const desc = document.getElementById('pm-desc');
        if (!btn) return;
        if (badge) badge.textContent = 'Pagamento confirmado ✓';
        if (desc) desc.textContent = 'Recebemos seu PIX. Clique para continuar.';
        btn.disabled = false;
        btn.innerHTML = '✓ Continuar';
        // Purchase — só o pixel client-side (sem CAPI, sem advanced matching, sem event_id/dedup).
        if (typeof window.fbq === 'function' && currentPixData) {
          try { window.fbq('track', 'Purchase', { value: (currentPixData.amount || 0) / 100, currency: 'BRL' }); } catch {}
        }
        // Optional: auto-avança em 1.5s
        setTimeout(() => { const b = document.getElementById('pm-paid'); if (b && !b.dataset.clicked) b.click(); }, 1500);
      }

      function markRejected(status) {
        const btn = document.getElementById('pm-paid');
        const badge = document.getElementById('pm-badge');
        const desc = document.getElementById('pm-desc');
        const msg = status === 'refunded' ? 'PIX estornado'
                  : status === 'chargeback' ? 'Pagamento contestado'
                  : 'Pagamento recusado';
        if (badge) { badge.textContent = msg; badge.style.background = '#fef2f2'; badge.style.color = '#b91c1c'; }
        if (desc) desc.textContent = 'Feche e gere um novo PIX.';
        if (btn) { btn.disabled = true; btn.innerHTML = 'Gere um novo PIX'; }
      }

      function markExpired() {
        const btn = document.getElementById('pm-paid');
        const badge = document.getElementById('pm-badge');
        const desc = document.getElementById('pm-desc');
        if (badge) { badge.textContent = 'PIX expirado'; badge.style.background = '#fef2f2'; badge.style.color = '#b91c1c'; }
        if (desc) desc.textContent = 'O tempo pra pagamento acabou. Feche e gere um novo PIX.';
        if (btn) { btn.disabled = true; btn.innerHTML = 'Expirado — feche e tente de novo'; }
      }

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, (c) => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
      }

      // Exposed: bundle chama window.__pixModal(fullUrl, nextPath).
      // fullUrl = /checkout.html?p=SLUG&name=...&email=... (produzido por R8)
      // nextPath = /upsellN (ou similar) — pra onde navegar quando pagar.
      window.__pixModal = function (url, nextPath) {
        if (isLoading) return; // evita 2 fetches concorrentes em duplo clique
        // nextPath já foi salvo em localStorage.checkout_next_url pelo d5()
        // do bundle antes desta chamada — /retorno lê de lá, não daqui.
        const slug = extractSlug(url);
        if (!slug) { window.location.href = url; return; }

        const customer = getCustomer();
        // Se dados incompletos, usa fallback (checkout.html standalone com form)
        if (!customer.name || !customer.email || customer.cpf.length !== 11 || customer.phone.length < 10) {
          window.location.href = url;
          return;
        }

        currentSlug = slug;
        currentCustomer = customer;
        isLoading = true;
        open();
        renderLoading();

        fetch('/api/create-pix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, customer }),
        })
          .then((r) => r.json().then((d) => ({ ok: r.ok, data: d })))
          .then(({ ok, data }) => {
            if (!ok || !data.qrcode) throw new Error(data.error || 'Falha ao gerar PIX');
            renderPix(data);
          })
          .catch((err) => renderError(err.message || 'Erro inesperado', url))
          .finally(() => { isLoading = false; });
      };
    })();
    </script>
